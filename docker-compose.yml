services:
  # ─── Backend API (PHP-FPM) ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: plant-lab-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Backend:/var/www/html
      - ./Backend/storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: plant_lab
      DB_USERNAME: plant_lab
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - plant-lab

  # ─── Nginx Web Server ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: plant-lab-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./Backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - plant-lab

  # ─── PostgreSQL Database ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: plant-lab-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: plant_lab
      POSTGRES_USER: plant_lab
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant_lab -d plant_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plant-lab

  # ─── Redis Cache ────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: plant-lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - plant-lab

  # ─── Frontend (Vite Dev Server) ─────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: plant-lab-frontend
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_API_URL: http://localhost:8000/api/v1
    command: sh -c "npm install --prefer-offline && npm run dev -- --host 0.0.0.0"
    depends_on:
      - nginx
    networks:
      - plant-lab

  # ─── Queue Worker ───────────────────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: plant-lab-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Backend:/var/www/html
      - ./Backend/storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: plant_lab
      DB_USERNAME: plant_lab
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    command: php artisan queue:work redis --tries=3 --sleep=3 --timeout=90
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - plant-lab

  # ─── Task Scheduler ────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: plant-lab-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Backend:/var/www/html
      - ./Backend/storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: plant_lab
      DB_USERNAME: plant_lab
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - plant-lab

volumes:
  db-data:
  redis-data:
  frontend-node-modules:

networks:
  plant-lab:
    driver: bridge
